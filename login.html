<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Entrar — 1K Beats Gestão</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#D91A72">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/secure.css?v=6.6.0">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Space Grotesk', system-ui, sans-serif;
  background: #F4F4F8;
  color: #1A1A25;
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
}
a { color: #D91A72; text-decoration: none; }
a:hover { color: #B8105E; }

@keyframes fadeUp  { from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none} }
@keyframes waveMove{ 0%{transform:translateX(0)}100%{transform:translateX(-50%)} }
@keyframes eq1 { 0%,100%{transform:scaleY(0.3)}50%{transform:scaleY(1)} }
@keyframes eq2 { 0%,100%{transform:scaleY(0.7)}33%{transform:scaleY(0.2)}66%{transform:scaleY(0.9)} }
@keyframes eq3 { 0%,100%{transform:scaleY(0.9)}50%{transform:scaleY(0.15)} }
@keyframes eq4 { 0%,100%{transform:scaleY(0.4)}40%{transform:scaleY(1)} }
@keyframes eq5 { 0%,100%{transform:scaleY(0.6)}60%{transform:scaleY(0.2)} }
@keyframes eq6 { 0%,100%{transform:scaleY(0.2)}50%{transform:scaleY(0.85)} }
@keyframes blinkDot { 0%,100%{opacity:1}50%{opacity:0.3} }

.wrap {
  width: 100%; max-width: 400px;
  animation: fadeUp .5s ease-out both;
}

/* ── LOGO AREA ── */
.logo-area { text-align: center; margin-bottom: 28px; }

.wave-strip { overflow: hidden; height: 24px; margin-bottom: 16px; }
.wave-strip svg { width: 200%; height: 100%; animation: waveMove 3.5s linear infinite; }

.logo-mark {
  display: inline-flex; align-items: center; gap: 14px; margin-bottom: 12px;
}
.logo-icon {
  width: 56px; height: 56px; background: #D91A72; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 24px rgba(217,26,114,0.3); flex-shrink: 0;
}
.logo-icon svg { width: 36px; height: 36px; }
.logo-text-main {
  font-size: 28px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; color: #1A1A25;
}
.logo-text-main .beats { color: #9090B0; }
.logo-text-main .waves { color: #D91A72; }
.logo-text-sub {
  font-size: 9px; font-weight: 700; letter-spacing: 0.2em; color: #9090B0;
  text-transform: uppercase; margin-top: 4px; font-family: 'Space Mono', monospace;
}

.eq-bars {
  display: flex; align-items: flex-end; justify-content: center;
  gap: 3px; height: 18px; margin-top: 10px;
}
.eq-bar { width: 4px; background: #D91A72; border-radius: 1px 1px 0 0; transform-origin: bottom; }
.eq-bar:nth-child(1)  { animation: eq1 0.7s  ease-in-out infinite; }
.eq-bar:nth-child(2)  { animation: eq2 0.5s  ease-in-out infinite; }
.eq-bar:nth-child(3)  { animation: eq3 0.9s  ease-in-out infinite; }
.eq-bar:nth-child(4)  { animation: eq4 0.6s  ease-in-out infinite; background:#FF4DA6; }
.eq-bar:nth-child(5)  { animation: eq1 0.75s ease-in-out 0.1s infinite; }
.eq-bar:nth-child(6)  { animation: eq5 0.8s  ease-in-out infinite; }
.eq-bar:nth-child(7)  { animation: eq3 0.65s ease-in-out infinite; }
.eq-bar:nth-child(8)  { animation: eq6 0.55s ease-in-out infinite; background:#FF4DA6; }
.eq-bar:nth-child(9)  { animation: eq2 0.85s ease-in-out infinite; }
.eq-bar:nth-child(10) { animation: eq4 0.7s  ease-in-out infinite; }
.eq-bar:nth-child(11) { animation: eq1 0.9s  ease-in-out infinite; }
.eq-bar:nth-child(12) { animation: eq5 0.6s  ease-in-out infinite; background:#FF4DA6; }

/* ── CARD ── */
.card {
  background: #FFFFFF;
  border: 1px solid #E4E4EE;
  border-radius: 12px;
  padding: 32px 28px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  position: relative; overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, transparent 0%, #D91A72 50%, transparent 100%);
}

.rec-badge {
  display: flex; align-items: center; gap: 6px;
  font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
  color: #9090B0; letter-spacing: 0.12em; margin-bottom: 18px;
}
.rec-dot { width: 6px; height: 6px; background: #D91A72; border-radius: 50%; animation: blinkDot 1.2s ease infinite; }

.card-title { font-size: 20px; font-weight: 700; color: #1A1A25; margin-bottom: 3px; }
.card-sub   { font-size: 11px; color: #9090B0; margin-bottom: 24px; font-family: 'Space Mono', monospace; letter-spacing: 0.04em; }

/* ── FIELDS ── */
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 9px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.14em;
  color: #9090B0; margin-bottom: 7px; font-family: 'Space Mono', monospace;
}
.field input {
  width: 100%; height: 46px;
  background: #F8F8FC; border: 1.5px solid #E4E4EE; border-radius: 6px;
  padding: 0 14px; font-size: 14px; color: #1A1A25;
  font-family: 'Space Grotesk', sans-serif; outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.field input::placeholder { color: #C0C0D0; }
.field input:focus {
  border-color: #D91A72;
  box-shadow: 0 0 0 3px rgba(217,26,114,0.1);
  background: #FFFFFF;
}

/* ── BUTTON ── */
.btn-login {
  width: 100%; height: 48px;
  background: #D91A72; border: none; border-radius: 6px;
  font-size: 13px; font-weight: 700; color: #fff;
  font-family: 'Space Mono', monospace; cursor: pointer; margin-top: 8px;
  letter-spacing: 0.1em; text-transform: uppercase;
  box-shadow: 0 4px 20px rgba(217,26,114,0.35);
  transition: background .2s, box-shadow .2s, transform .1s;
}
.btn-login:hover { background: #B8105E; box-shadow: 0 6px 28px rgba(217,26,114,0.4); }
.btn-login:active { transform: scale(.98); }
.btn-login:disabled { background: #E0E0E8; cursor: not-allowed; box-shadow: none; color: #9090B0; }

/* ── ERROR ── */
.error {
  display: none;
  background: rgba(220,38,38,0.05);
  border: 1px solid rgba(220,38,38,0.2);
  border-left: 3px solid #DC2626;
  padding: 10px 14px; font-size: 12px; color: #DC2626;
  margin-bottom: 16px; border-radius: 4px;
  font-family: 'Space Mono', monospace;
}

.forgot { text-align: center; margin-top: 16px; font-size: 12px; color: #9090B0; }

/* ── FOOTER ── */
.footer {
  text-align: center; margin-top: 20px;
  font-size: 11px; color: #C0C0D0; letter-spacing: 0.05em;
  font-family: 'Space Mono', monospace; line-height: 1.8;
}
.footer strong { color: #9090B0; }
@media (max-width: 600px) {
  body { align-items: flex-start; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .logo-area { margin-bottom: 20px; }
  .card { padding: 26px 20px; }
  .field input { font-size: 16px; }
}
</style>
</head>
<body>

<div class="wrap">

  <div class="logo-area">
    <div class="wave-strip">
      <svg viewBox="0 0 600 24" preserveAspectRatio="none">
        <path d="M0,12 Q15,3 30,12 Q45,21 60,12 Q75,3 90,12 Q105,21 120,7 Q135,1 150,12 Q165,21 180,5 Q195,1 210,12 Q225,21 240,8 Q255,3 270,12 Q285,21 300,12 Q315,3 330,12 Q345,21 360,12 Q375,3 390,12 Q405,21 420,7 Q435,1 450,12 Q465,21 480,5 Q495,1 510,12 Q525,21 540,8 Q555,3 570,12 Q585,21 600,12" stroke="#D91A72" fill="none" stroke-width="1.5" opacity="0.3"/>
      </svg>
    </div>

    <div class="logo-mark">
      <div class="logo-icon">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <text x="4" y="40" font-family="'Space Grotesk',sans-serif" font-weight="700" font-size="30" fill="white">1K</text>
          <path d="M46 16 C54 24 54 32 46 40" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.9"/>
          <path d="M52 20 C58 26 58 30 52 36" stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.55"/>
        </svg>
      </div>
      <div>
        <div class="logo-text-main">1K<span class="beats">beats</span><span class="waves">))</span></div>
        <div class="logo-text-sub">Sistema de Orçamentos</div>
      </div>
    </div>

    <div class="eq-bars">
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
      <div class="eq-bar" style="height:18px"></div>
    </div>
  </div>

  <div class="card">
    <div class="rec-badge">
      <div class="rec-dot"></div>
      <span>ACESSO SEGURO · v6.7.0</span>
    </div>

    <div class="card-title">Acesse sua conta</div>
    <div class="card-sub">GESTÃO DE ORÇAMENTOS E EVENTOS</div>

    <div class="error" id="errMsg" role="alert" aria-live="polite">E-mail ou senha incorretos.</div>

    <form id="loginForm" novalidate>
    <div class="field">
      <label for="usuario">E-mail</label>
      <input type="email" id="usuario" placeholder="seu@email.com" autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email" required>
    </div>
    <div class="field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password" required>
    </div>

    <button class="btn-login" id="btnLogin" type="submit">ENTRAR</button>
    <button class="btn-install" type="button" data-pwa-install>INSTALAR NO CELULAR</button>

    <div class="forgot">
      Esqueceu a senha?
      <a href="#" id="forgotLink">Recuperar por e-mail</a>
    </div>
    </form>
  </div>

  <div class="footer">
    Desenvolvido por <strong>Alessandro Lima</strong><br>
    © 2026 · Todos os direitos reservados<br><span style="font-size:10px;opacity:0.5">v6.7.0</span> · ambiente seguro
  </div>
</div>

<script src="./js/config.js?v=6.7.0"></script>
<script src="./js/api.js?v=6.6.0"></script>
<script src="./js/password-toggle.js?v=6.6.0"></script>
<script src="./js/pwa-install.js?v=6.7.0"></script>
<script src="./js/login.js?v=6.6.0"></script>
</body>
</html>
