<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Redefinir senha — 1K Beats</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#D91A72">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css?v=6.4.1">
  <link rel="stylesheet" href="./css/secure.css?v=6.4.1">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:20px; background:#F4F4F8; font-family:'Space Grotesk',system-ui,sans-serif; color:#1A1A25; }
    .reset-card { width:min(430px,100%); background:#fff; border:1px solid #e5e5ec; border-radius:16px; padding:32px; box-shadow:0 18px 50px rgba(20,20,30,.08); }
    .reset-card h1 { margin:0 0 8px; font-size:24px; }
    .reset-card p { color:#777; font-size:14px; margin:0 0 24px; }
    .reset-card label { display:block; font-size:12px; font-weight:700; margin:14px 0 6px; }
    .reset-card input { width:100%; min-height:46px; box-sizing:border-box; padding:12px; border:1.5px solid #ddd; border-radius:8px; font:16px 'Space Grotesk',sans-serif; outline:none; }
    .reset-card input:focus { border-color:#D91A72; box-shadow:0 0 0 3px rgba(217,26,114,.1); }
    .reset-card button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:8px; background:#D91A72; color:#fff; font-weight:700; cursor:pointer; }
    .reset-card button:disabled { opacity:.55; cursor:not-allowed; }
    .reset-message { min-height:22px; margin-top:14px; font-size:13px; }
    .reset-message.error { color:#b42318; }
    .reset-message.success { color:#067647; }
    .reset-brand { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-bottom:18px; margin-bottom:22px; border-bottom:1px solid #ececf2; }
    .reset-brand strong { font-size:20px; letter-spacing:-.04em; }
    .reset-brand strong span { color:#9090B0; font-weight:500; }
    .reset-brand small { color:#D91A72; font:700 9px 'Space Mono',monospace; letter-spacing:.1em; text-align:right; }
    .reset-back { display:block; margin-top:18px; text-align:center; color:#777788; font-size:12px; text-decoration:none; }
    .reset-back:hover { color:#D91A72; }
    @media(max-width:480px){ .reset-card{padding:24px 20px}.reset-brand{align-items:flex-start;flex-direction:column;gap:5px}.reset-brand small{text-align:left} }
  </style>
</head>
<body>
  <main class="reset-card">
    <div class="reset-brand"><strong>1K <span>beats))</span></strong><small>ACESSO SEGURO · v6.4.1</small></div>
    <h1>Crie uma nova senha</h1>
    <p>Use uma senha exclusiva com pelo menos 8 caracteres e confirme-a abaixo.</p>
    <label for="newPassword">Nova senha</label>
    <input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirmPassword">Confirmar senha</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
    <button id="btnResetPassword" type="button">ALTERAR SENHA</button>
    <div id="resetMessage" class="reset-message" role="status" aria-live="polite"></div>
    <a class="reset-back" href="./login.html">← Voltar para o acesso</a>
  </main>
  <script src="./js/config.js?v=6.4.1"></script>
  <script src="./js/password-toggle.js?v=6.4.1"></script>
  <script src="./js/reset-password.js?v=6.4.1"></script>
</body>
</html>
